[project]
name = "the-root-directory"
version = "0.1.0"
description = "Be the real super user!"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ruff>=0.15.2",
    "coverage==7.13.4",
    "Django==6.0.2",
    "python-dotenv==1.2.1",
    "markdown>=3.10.2",
]
[tool.ruff]
line-length = 100
exclude = [
    "**/migrations/**"
]
[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "B",
    "DJ",
]