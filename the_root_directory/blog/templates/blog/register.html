{% extends 'base.html' %}
{% load static %}

{% block extra-head %}
<link rel="stylesheet" href="{% static 'home.css'%}">
{% endblock %}

{% block content %}
<div class="container">
    <h1>Create a new Owner</h1>
    <form method="post">
        {% csrf_token %}
        {{user_form.as_p}}
        {{owner_form.as_p}}
        <button type="submit" class="btn btn-dark">Create</button>
    </form>
</div>
{% endblock %}
